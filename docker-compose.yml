services:
  furniture-api:
    container_name: furniture-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3007
    volumes:
      - ./:/usr/src/furniture
    working_dir: /usr/src/furniture
    env_file: .env
    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm ci && npm run build && npm run start:prod"

  furniture-batch:
    container_name: furniture-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/furniture
    working_dir: /usr/src/furniture
    env_file: .env
    depends_on:
      - furniture-api
    networks:
      - monorepo-network

    # FOR PRODUCTION (node_modules is installed by furniture-api on the shared volume)
    command: bash -c "npx nest build furniture-batch && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
