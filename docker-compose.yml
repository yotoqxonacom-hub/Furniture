services:
  furniture-api:
    container_name: furniture-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3007
    volumes:
      - ./:/usr/src/furniture
    working_dir: /usr/src/furniture
    env_file: .env
    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm ci && npm run build && npm run start:prod"

    # Healthy once GraphQL answers; npm ci + build can take several minutes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -X POST -H 'Content-Type: application/json' -d '{\"query\":\"{__typename}\"}' http://localhost:3007/graphql || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15m

  furniture-batch:
    container_name: furniture-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/furniture
    working_dir: /usr/src/furniture
    env_file: .env
    depends_on:
      furniture-api:
        condition: service_healthy
    networks:
      - monorepo-network

    # FOR PRODUCTION (furniture-api installs node_modules and builds both apps on the shared volume)
    command: bash -c "npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
